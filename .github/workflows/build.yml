name: Build

# Cross-platform build for ISearch (Tauri 2).
# - pull_request / push: compile & package artifacts (macOS signs only if Apple secrets exist)
# - tag v*: draft GitHub Release with installers attached

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
            artifact: macos-aarch64
          - platform: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
            artifact: macos-x86_64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
            artifact: linux-x86_64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            artifact: windows-x86_64

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config \
            libpcap-dev \
            libclamav-dev \
            clamav

      - name: Install macOS system dependencies
        if: startsWith(matrix.platform, 'macos')
        run: |
          brew update
          brew install clamav pkg-config || true
          brew list libpcap >/dev/null 2>&1 || brew install libpcap || true

      - name: Install Windows system dependencies
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: |
          choco install llvm wixtoolset -y --no-progress

          # Npcap SDK headers/libs for the `pcap` crate
          $npcap = "npcap-sdk-1.13.zip"
          Invoke-WebRequest -Uri "https://npcap.com/dist/$npcap" -OutFile $npcap
          Expand-Archive -Path $npcap -DestinationPath "$env:GITHUB_WORKSPACE\npcap-sdk" -Force
          "LIB=$env:GITHUB_WORKSPACE\npcap-sdk\Lib\x64;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Cache vcpkg (Windows)
        if: startsWith(matrix.platform, 'windows')
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/vcpkg/installed
            ${{ github.workspace }}/vcpkg/packages
          key: vcpkg-clamav-${{ runner.os }}-${{ hashFiles('.github/workflows/build.yml') }}

      - name: Install ClamAV via vcpkg (Windows)
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: |
          $vcpkgRoot = Join-Path $env:GITHUB_WORKSPACE "vcpkg"
          if (-not (Test-Path "$vcpkgRoot\vcpkg.exe")) {
            git clone --depth 1 https://github.com/microsoft/vcpkg.git $vcpkgRoot
            & "$vcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics
          }
          & "$vcpkgRoot\vcpkg.exe" install clamav:x64-windows --clean-after-build
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VCPKGRS_DYNAMIC=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $bin = Join-Path $vcpkgRoot "installed\x64-windows\bin"
          "PATH=$bin;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: ${{ matrix.artifact }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare Apple API key (macOS notarization)
        if: ${{ startsWith(matrix.platform, 'macos') && secrets.APPLE_API_KEY != '' && secrets.APPLE_API_KEY_P8 != '' }}
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          mkdir -p "$HOME/private_keys"
          KEY_PATH="$HOME/private_keys/AuthKey_${APPLE_API_KEY}.p8"
          if echo "$APPLE_API_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$APPLE_API_KEY_P8" > "$KEY_PATH"
          else
            echo "$APPLE_API_KEY_P8" | base64 --decode > "$KEY_PATH"
          fi
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          echo "API_PRIVATE_KEYS_DIR=$HOME/private_keys" >> "$GITHUB_ENV"

      - name: Import Apple Developer certificate
        if: ${{ startsWith(matrix.platform, 'macos') && secrets.APPLE_CERTIFICATE != '' }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"

          if [ -z "$KEYCHAIN_PASSWORD" ]; then
            KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          fi

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep -E 'Developer ID Application|Apple Distribution|Apple Development' \
            | head -1 \
            | sed -E 's/.*"([^"]+)".*/\1/')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::No usable code signing identity found in the imported certificate"
            security find-identity -v -p codesigning "$KEYCHAIN_PATH"
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "Imported signing identity: $IDENTITY"
          rm -f "$CERT_PATH"

      - name: Build Tauri app (no release)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
          API_PRIVATE_KEYS_DIR: ${{ env.API_PRIVATE_KEYS_DIR }}
        with:
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Build Tauri app (draft release)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
          API_PRIVATE_KEYS_DIR: ${{ env.API_PRIVATE_KEYS_DIR }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ISearch ${{ github.ref_name }}
          releaseBody: |
            ## Downloads
            Installers for macOS (Apple Silicon / Intel), Windows, and Linux are attached.

            ## Notes
            - macOS builds are signed and notarized when Apple secrets are configured.
            - See `docs/ci-release.md` for secret setup.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Collect build artifacts
        shell: bash
        run: |
          set -euo pipefail
          DEST="artifacts/${{ matrix.artifact }}"
          mkdir -p "$DEST"
          ROOT="src-tauri/target/${{ matrix.target }}/release/bundle"
          if [ ! -d "$ROOT" ]; then
            ROOT="src-tauri/target/release/bundle"
          fi
          echo "Looking for bundles under $ROOT"
          find "$ROOT" -type f \( \
            -name '*.dmg' -o \
            -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o \
            -name '*.exe' -o -name '*.msi' \
          \) -print0 2>/dev/null | while IFS= read -r -d '' f; do
            cp -v "$f" "$DEST/"
          done
          # Package .app as zip for artifact upload
          find "$ROOT" -maxdepth 2 -type d -name '*.app' -print0 2>/dev/null | while IFS= read -r -d '' app; do
            base="$(basename "$app")"
            (cd "$(dirname "$app")" && zip -qry "$GITHUB_WORKSPACE/$DEST/${base}.zip" "$base")
          done
          ls -lahR "$DEST" || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: isearch-${{ matrix.artifact }}
          path: artifacts/${{ matrix.artifact }}/*
          if-no-files-found: warn
          retention-days: 14
